Name: temple-service
Host: 0.0.0.0
Port: 8083

Telemetry:
  Name: temple-service
  Endpoint: http://localhost:2379
  Sampler: 1.0
  Batcher: jaeger

# RabbitMQ（消费 blessing.dispatch 派单事件 / 发布 blessing.assign 分配事件）
RabbitMQ:
  Host: localhost
  Port: 5672
  User: admin
  Password: admin
  VHost: "/"

# MySQL 连接（temple 表在 askxuan 库，temple_image/temple_admin/temple_audit/temple_service 在 askxuan_temple 库，blessing_task 在 askxuan_diy 库）
MySQL:
  DataSource: "root:root123@tcp(127.0.0.1:3306)/askxuan?charset=utf8mb4&parseTime=true&loc=Local"
