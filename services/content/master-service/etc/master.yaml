Name: master-service
Host: 0.0.0.0
Port: 8084

Telemetry:
  Name: master-service
  Endpoint: http://localhost:2379
  Sampler: 1.0
  Batcher: jaeger

# MySQL 数据源（master 表在 askxuan 库；master_credential/master_schedule/master_audit 在 askxuan_master 库；
# blessing_task 在 askxuan_diy 库，通过 fully-qualified 表名跨库访问）
MySQL:
  DataSource: "root:root123@tcp(127.0.0.1:3306)/askxuan?charset=utf8mb4&parseTime=true&loc=Local"

# JWT 签名密钥
AuthSecret: "askxuan-access-secret-change-in-prod"

# RabbitMQ（消费 blessing.assign 分配事件 / 发布 blessing.complete 完成事件）
RabbitMQ:
  Host: localhost
  Port: 5672
  User: admin
  Password: admin
  VHost: "/"
