Name: review-service
Host: 0.0.0.0
Port: 8092

# etcd 服务注册（供 gateway-service 动态发现）
Etcd:
  Hosts:
    - localhost:2379
  Key: review.service

Telemetry:
  Name: review-service
  Endpoint: http://localhost:2379
  Sampler: 1.0
  Batcher: jaeger

# MySQL 数据源
MySQL:
  DataSource: "review_user:Askxuan2026!@tcp(127.0.0.1:3306)/askxuan_review?charset=utf8mb4&parseTime=true&loc=Local"

# RabbitMQ（发布 review.notify 新评价通知事件）
RabbitMQ:
  Host: localhost
  Port: 5672
  User: admin
  Password: admin
  VHost: "/"
