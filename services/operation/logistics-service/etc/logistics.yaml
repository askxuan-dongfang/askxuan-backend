Name: logistics-service
Host: 0.0.0.0
Port: 8095

# etcd 服务注册（供 gateway-service 动态发现）
Etcd:
  Hosts:
    - localhost:2379
  Key: logistics.service

Telemetry:
  Name: logistics-service
  Endpoint: http://localhost:2379
  Sampler: 1.0
  Batcher: jaeger

# MySQL 数据源
MySQL:
  DataSource: "logistics_user:Askxuan2026!@tcp(127.0.0.1:3306)/askxuan_logistics?charset=utf8mb4&parseTime=true&loc=Local"

# RabbitMQ（发布 logistics.sync 物流状态变更事件）
RabbitMQ:
  Host: localhost
  Port: 5672
  User: admin
  Password: admin
  VHost: "/"

# Redis（消息幂等性检查）
Redis:
  Host: localhost:6379
  Type: node
