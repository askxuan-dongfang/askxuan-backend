Name: finance-service
Host: 0.0.0.0
Port: 8091

Telemetry:
  Name: finance-service
  Endpoint: http://localhost:2379
  Sampler: 1.0
  Batcher: jaeger

# MySQL 数据源
MySQL:
  DataSource: "root:root123@tcp(127.0.0.1:3306)/askxuan_finance?charset=utf8mb4&parseTime=true&loc=Local"

# RabbitMQ（消费 booking.status / order.status / payment.notify / 发布 withdrawal.notify）
RabbitMQ:
  Host: localhost
  Port: 5672
  User: admin
  Password: admin
  VHost: "/"
