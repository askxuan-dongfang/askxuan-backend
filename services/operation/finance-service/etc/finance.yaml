Name: finance-service
Host: 0.0.0.0
Port: 8091

# etcd 服务注册（供 gateway-service 动态发现）
Etcd:
  Hosts:
    - localhost:2379
  Key: finance.service

Telemetry:
  Name: finance-service
  Endpoint: http://localhost:2379
  Sampler: 1.0
  Batcher: jaeger

# MySQL 数据源
MySQL:
  DataSource: "finance_user:Askxuan2026!@tcp(127.0.0.1:3306)/askxuan_finance?charset=utf8mb4&parseTime=true&loc=Local"

# RabbitMQ（消费 booking.status / order.status / payment.notify / 发布 withdrawal.notify）
RabbitMQ:
  Host: localhost
  Port: 5672
  User: admin
  Password: admin
  VHost: "/"

# Redis（消息幂等性检查）
Redis:
  Host: localhost:6379
  Type: node

# JWT 签名密钥
AuthSecret: "askxuan-access-secret-change-in-prod"
