Name: file-service
Host: 0.0.0.0
Port: 8097

# etcd 服务注册（供 gateway-service 动态发现）
Etcd:
  Hosts:
    - localhost:2379
  Key: file.service

Telemetry:
  Name: file-service
  Endpoint: http://localhost:2379
  Sampler: 1.0
  Batcher: jaeger

# MinIO 对象存储
MinIO:
  Endpoint: localhost:9000
  PublicBaseURL: http://localhost:9000
  AccessKey: minioadmin
  SecretKey: minioadmin
  Bucket: askxuan
  UseSSL: false
  PresignExpire: 900  # 预签名 URL 有效期（秒），默认 15 分钟

Backup:
  Enabled: true
  RestoreEnabled: false
  Bucket: askxuan-backups
  MySQLHost: 127.0.0.1
  MySQLPort: 3306
  MySQLUser: root
  MySQLPassword: root123
  Schemas:
    - askxuan
    - askxuan_auth
    - askxuan_user
    - askxuan_temple
    - askxuan_master
    - askxuan_booking
    - askxuan_product
    - askxuan_order
    - askxuan_payment
    - askxuan_diy
    - askxuan_finance
    - askxuan_review
    - askxuan_audit
    - askxuan_message
    - askxuan_logistics
    - askxuan_marketing
    - askxuan_ai
    - askxuan_media
    - askxuan_community
  DumpCommand: mysqldump
  RestoreCommand: mysql
  TimeoutSeconds: 600
