Name: ai-service
Host: 0.0.0.0
Port: 8098
Timeout: 75000

# etcd 服务注册（供 gateway-service 动态发现）
Etcd:
  Hosts:
    - localhost:2379
  Key: ai.service

Telemetry:
  Name: ai-service
  Endpoint: http://localhost:2379
  Sampler: 1.0
  Batcher: jaeger

# MySQL 数据源
MySQL:
  DataSource: "ai_user:Askxuan2026!@tcp(127.0.0.1:3306)/askxuan_ai?charset=utf8mb4&parseTime=true&loc=Local"

# 环境变量 AI_PROVIDER/AI_BASE_URL/AI_API_KEY/AI_MODEL 会覆盖下列值。
AI:
  Provider: mock
  BaseURL: ""
  APIKey: ""
  Model: ""
  MinuteRequestLimit: 12
  DailyRequestLimit: 100
  MaxInputChars: 2000
  MaxHistoryMessages: 30
  MaxOutputTokens: 2048
  InputCostPerMillion: 0
  OutputCostPerMillion: 0
  BlockedTerms: []
  MCP:
    Enabled: false
    BaseURL: ""
    Timeout: 10
