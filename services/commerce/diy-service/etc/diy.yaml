Name: diy-service
Host: 0.0.0.0
Port: 8088

# etcd 服务注册（供 gateway-service 动态发现）
Etcd:
  Hosts:
    - localhost:2379
  Key: diy.service

DataSource: "diy_user:Askxuan2026!@tcp(127.0.0.1:3306)/askxuan_diy?charset=utf8mb4&parseTime=true&loc=Local"

Redis:
  Host: localhost:6379
  Type: node

Telemetry:
  Name: diy-service
  Endpoint: http://localhost:2379
  Sampler: 1.0
  Batcher: jaeger

# RabbitMQ（加持任务派单 / 状态通知）
RabbitMQ:
  Host: localhost
  Port: 5672
  User: admin
  Password: admin
  VHost: "/"

# gRPC server（供 master-service / temple-service 通过 zrpc 调用查询 blessing_task）
# ListenOn 端口需与 rest 端口 8088 不同，使用 9088
DiyRpc:
  Name: diy.rpc
  ListenOn: 127.0.0.1:9088
  Etcd:
    Hosts:
      - localhost:2379
    Key: diy.rpc

