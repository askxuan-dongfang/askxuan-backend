Name: product-service
Host: 0.0.0.0
Port: 8086

# etcd 服务注册（供 gateway-service 动态发现）
Etcd:
  Hosts:
    - localhost:2379
  Key: product.service

# MySQL 数据源
DataSource: "product_user:Askxuan2026!@tcp(127.0.0.1:3306)/askxuan_product?charset=utf8mb4&parseTime=true&loc=Local"

# Redis 缓存
Redis:
  Host: localhost:6379
  Type: node

Telemetry:
  Name: product-service
  Endpoint: http://localhost:2379
  Sampler: 1.0
  Batcher: jaeger
