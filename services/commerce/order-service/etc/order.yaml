Name: order-service
Host: 0.0.0.0
Port: 8089

ProductRpc:
  Etcd:
    Hosts:
      - localhost:2379
    Key: product.rpc
  Timeout: 5000

OrderRpc:
  Name: order.rpc
  ListenOn: 127.0.0.1:9089
  Etcd:
    Hosts:
      - localhost:2379
    Key: order.rpc

# etcd 服务注册（供 gateway-service 动态发现）
Etcd:
  Hosts:
    - localhost:2379
  Key: order.service

DataSource: "order_user:Askxuan2026!@tcp(127.0.0.1:3306)/askxuan_order?charset=utf8mb4&parseTime=true&loc=Local"

# JWT 签名密钥（与网关/其他服务共享，用于签名内部服务调用 token）
AuthSecret: "askxuan-access-secret-change-in-prod"

# payment-service 网关地址（为空默认 http://localhost:8080）
PaymentGateway: "http://localhost:8080"

Redis:
  Host: localhost:6379
  Type: node

Telemetry:
  Name: order-service
  Endpoint: http://localhost:2379
  Sampler: 1.0
  Batcher: jaeger

# RabbitMQ（订单状态变更通知）
RabbitMQ:
  Host: localhost
  Port: 5672
  User: admin
  Password: admin
  VHost: "/"
