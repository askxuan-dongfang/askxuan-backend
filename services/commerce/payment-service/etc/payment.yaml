Name: payment-service
Host: 0.0.0.0
Port: 8090

# etcd 服务注册（供 gateway-service 动态发现）
Etcd:
  Hosts:
    - localhost:2379
  Key: payment.service

DataSource: "payment_user:Askxuan2026!@tcp(127.0.0.1:3306)/askxuan_payment?charset=utf8mb4&parseTime=true&loc=Local"

Redis:
  Host: localhost:6379
  Type: node

Telemetry:
  Name: payment-service
  Endpoint: http://localhost:2379
  Sampler: 1.0
  Batcher: jaeger

# RabbitMQ（支付通知）
RabbitMQ:
  Host: localhost
  Port: 5672
  User: admin
  Password: admin
  VHost: "/"

# 微信支付配置
WechatPay:
  AppId: ""
  MchId: ""
  ApiKey: ""
  NotifyUrl: "https://api.askxuan.com/api/v1/payments/callback/wechat"

# 支付宝配置
Alipay:
  AppId: ""
  PrivateKey: ""
  PublicKey: ""
  NotifyUrl: "https://api.askxuan.com/api/v1/payments/callback/alipay"

# JWT 鉴权配置（退款路由服务侧 JWT 校验，与网关层形成纵深防御）
Auth:
  AccessSecret: "askxuan-access-secret-change-in-prod"
  AccessExpire: 7200
