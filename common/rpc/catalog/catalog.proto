syntax = "proto3";

package catalog;

option go_package = "github.com/askxuan/common/rpc/catalog;catalog";

message CartLine {
  int64 product_id = 1;
  int64 sku_id = 2;
  int32 quantity = 3;
}

message CatalogQuote {
  int64 product_id = 1;
  int64 sku_id = 2;
  string product_name = 3;
  string sku_spec = 4;
  double unit_price = 5;
  int32 quantity = 6;
  string image = 7;
}

message ReserveCartReq {
  string request_id = 1;
  repeated CartLine items = 2;
}

message ReserveCartResp {
  string request_id = 1;
  repeated CatalogQuote items = 2;
  double total_amount = 3;
}

message ReleaseCartReq { string request_id = 1; }
message ReleaseCartResp { bool released = 1; }

service CatalogService {
  rpc ReserveCart(ReserveCartReq) returns (ReserveCartResp);
  rpc ReleaseCart(ReleaseCartReq) returns (ReleaseCartResp);
}
