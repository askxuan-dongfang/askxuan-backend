name: Export fixed image cache from the release registry
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  export:
    if: github.repository == 'askxuan-dongfang/askxuan-backend' && github.ref == 'refs/heads/codex/model-image-cache-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Export the exact original Linux image content
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=scripts/ci python3 scripts/ci/export_image_cache.py \
            --artifact-id 14824182423 \
            --artifact-sha256 df8db462dd44603787d818b6a1a0d48dac024daba6a6be87ec834d9f4447437f \
            --run-id 45186503063 \
            --source 26d04a301b58a99ed28ca4dcc31fec7883e4258a \
            --output "$RUNNER_TEMP/askxuan-image-content"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-image-content
          path: ${{ runner.temp }}/askxuan-image-content
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
