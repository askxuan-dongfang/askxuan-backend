name: Export fixed image cache from the release registry
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  export:
    if: github.repository == 'askxuan-dongfang/askxuan-backend' && github.ref == 'refs/heads/codex/official-image-transfer-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Export the exact original Linux image content
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=scripts/ci python3 scripts/ci/export_image_cache.py \
            --artifact-id 14796973932 \
            --artifact-sha256 e98b57b47897382dce853b0bbe9ebc7c448cd07cb2fce6975fc3d85c63a6fedf \
            --run-id 45129643021 \
            --source a7f2025d963cb1cccdd9314587630c9b75e41025 \
            --output "$RUNNER_TEMP/askxuan-image-content"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-image-content
          path: ${{ runner.temp }}/askxuan-image-content
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
