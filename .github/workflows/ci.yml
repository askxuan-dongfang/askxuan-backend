# askXuan-backend CI 流水线
# 触发条件：push 到 main/develop 分支 或 Pull Request
#
# 历史教训：本仓库 checkout 根目录即后端代码根目录，
# 曾因 working-directory: askXuan-backend 导致所有 job 全部失败。

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: "1.22"

jobs:
  # ===== 编译检查（20 服务 + common 全量 go build） =====
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build all modules
        run: make build

  # ===== 单元测试（严格模式：任一模块失败即红） =====
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run tests (strict)
        run: make test-ci

  # ===== go vet =====
  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run go vet
        run: make vet

  # ===== Lint（暂缓启用） =====
  # 现有代码基线存在大量历史告警（如 go-zero 的 json:"...,optional"
  # 标签触发 staticcheck SA5008），全量清零前 lint 会长期红灯。
  # 清理完成后按下面模板重新启用（本地验证用 make lint-ci）：
