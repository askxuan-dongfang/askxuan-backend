name: CI and ECS release
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      recovery:
        description: 'Build a private draft package after all checks for operator relay'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.recovery != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.work'
          cache-dependency-path: '**/go.sum'
      - run: python3 scripts/ci/release.py backend
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: ecs-release
          path: release.tgz
          retention-days: 3
          if-no-files-found: error
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.work'
          cache-dependency-path: '**/go.sum'
      - run: make test-ci
      - name: Verify reward inventory and redemption transactions
        run: bash scripts/test-free-rewards.sh
        env:
          GOCACHE: ${{ runner.temp }}/reward-go-cache
      - run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
  vet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.work'
          cache-dependency-path: '**/go.sum'
      - run: make vet
  wallet-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: local-wallet-ci-only
          MYSQL_DATABASE: wallet_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -plocal-wallet-ci-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      WALLET_TEST_DSN: 'root:local-wallet-ci-only@tcp(127.0.0.1:3306)/wallet_test?charset=utf8mb4&parseTime=false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: 'go.work'
          cache-dependency-path: '**/go.sum'
      - run: go test ./internal/wallet -v
        working-directory: services/commerce/payment-service
      - run: go test ./internal/model ./internal/handler -run Wallet -v
        working-directory: services/operation/finance-service
  review-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: review-ci-test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost -proot" --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: 'go.work'
          cache-dependency-path: '**/go.sum'
      - run: docker exec ${{ job.services.mysql.id }} mysql -uroot -preview-ci-test -e 'CREATE DATABASE review_test_booking; CREATE DATABASE review_test_projection; CREATE DATABASE ai_runtime_test_ci; CREATE DATABASE askxuan_chat_test_ci; CREATE DATABASE askxuan_fulfillment_test_ci;'
      - run: go test ./services/content/booking-service/internal/logic ./services/content/review-service/internal/model -run 'TestReviewTransactionIntegration|TestProjectionIntegration' -v
        env:
          REVIEW_BOOKING_TEST_DSN: root:review-ci-test@tcp(127.0.0.1:3306)/review_test_booking?charset=utf8mb4
          REVIEW_TEST_DSN: root:review-ci-test@tcp(127.0.0.1:3306)/review_test_projection?charset=utf8mb4
      - name: Verify booking chat permissions and fulfillment transactions
        run: go test ./services/content/booking-service/internal/logic -run 'TestChatIntegration|TestFulfillmentIntegration' -v
        env:
          CHAT_TEST_DSN: 'root:review-ci-test@tcp(127.0.0.1:3306)/askxuan_chat_test_ci?charset=utf8mb4&parseTime=false'
          FULFILLMENT_TEST_DSN: 'root:review-ci-test@tcp(127.0.0.1:3306)/askxuan_fulfillment_test_ci?charset=utf8mb4&parseTime=false'
      - run: go test ./internal/model -run TestRepeatedToolCallsIntegration -v
        working-directory: services/infrastructure/ai-service
        env:
          AI_RUNTIME_TEST_DSN: root:review-ci-test@tcp(127.0.0.1:3306)/ai_runtime_test_ci?charset=utf8mb4
  cash-wallet-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: askxuan_payment
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: 'go.work'
          cache-dependency-path: '**/go.sum'
      - run: go test ./internal/cashier -run TestCashWalletMySQL -v
        working-directory: services/commerce/payment-service
        env:
          WALLET_TEST_DSN: 'root@tcp(127.0.0.1:3306)/askxuan_payment?charset=utf8mb4'
          WALLET_TEST_ISOLATED: '1'
      - run: go test ./internal/model -run TestDemoFinanceMySQL -v
        working-directory: services/operation/finance-service
        env:
          FINANCE_DEMO_TEST_DSN: 'root@tcp(127.0.0.1:3306)/askxuan_payment?charset=utf8mb4'
          WALLET_TEST_ISOLATED: '1'
  growth-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: 'go.work'
          cache-dependency-path: '**/go.sum'
      - run: bash scripts/test-growth.sh
  directory-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: askxuan_temple
        ports: ['13319:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      - run: go test ./internal/model -run TestDirectoryCascadeMySQL -count=1 -v
        working-directory: services/content/temple-service
        env:
          ASKXUAN_DIRECTORY_TEST_DSN: 'root@tcp(127.0.0.1:13319)/askxuan_temple?charset=utf8mb4'
  diy-publication-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      - name: Verify paid publication, frozen versions and creator attribution
        run: bash scripts/test-diy-publication.sh
  account-system-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: askxuan_account_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      ACCOUNT_SYSTEM_TEST_DSN: 'root@tcp(127.0.0.1:3306)/askxuan_account_test?charset=utf8mb4&parseTime=false'
      ACCOUNT_SYSTEM_TEST_ISOLATED: '1'
      ACCOUNT_SYSTEM_TEST_REDIS: '127.0.0.1:6379'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      - run: go test ./internal/model -count=1 -v
        working-directory: services/platform/user-service
      - run: go test ./internal/logic ./internal/handler -count=1 -v
        working-directory: services/platform/auth-service
      - run: go test ./internal/model ./internal/handler -run 'TestTempleState' -count=1 -v
        working-directory: services/content/temple-service
      - run: go test ./internal/logic -run 'TestOpenIMBanAndReplayMySQL' -count=1 -v
        working-directory: services/content/booking-service
      - run: go test ./internal/model -run 'TestParentTempleNewBusinessGateMySQL' -count=1 -v
        working-directory: services/content/master-service
  deploy:
    needs: [build, test, vet, wallet-mysql, review-mysql, cash-wallet-mysql, growth-mysql, directory-mysql, diy-publication-mysql, account-system-mysql]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ECS_DEPLOY_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ecs-release
      - name: Publish binaries through restricted SSH receiver
        env:
          ECS_HOST: ${{ vars.ECS_HOST }}
          ECS_DEPLOY_KEY: ${{ secrets.ECS_DEPLOY_KEY }}
          ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
        run: bash scripts/ci/publish.sh release.tgz
  recover-package:
    if: github.event_name == 'workflow_dispatch' && inputs.recovery == true && github.ref == 'refs/heads/main' && vars.ECS_DEPLOY_ENABLED == 'true'
    needs: [test, vet, wallet-mysql, review-mysql, cash-wallet-mysql, growth-mysql, directory-mysql, diy-publication-mysql, account-system-mysql]
    environment: production
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      - run: python3 scripts/ci/release.py backend
      - name: Retain verified package for operator relay
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
        run: |
          test "$PRIVATE_REPOSITORY" = true
          tag="ci-backend-relay-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sha256sum release.tgz > release.sha256
          gh release create "$tag" release.tgz release.sha256 --draft --target "$GITHUB_SHA" \
            --title "Verified backend package $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" \
            --notes "Private operator relay after all backend test jobs. Apply the reviewed additive schema migration and receiver contract baseline first, then verify source and manifest hashes and publish through the existing ECS receiver."
