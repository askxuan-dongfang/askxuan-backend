  media-service:
    <<: *backend-common
    container_name: askxuan-media-service
    image: askxuan/media-service:local
    build:
      <<: *backend-build
      args:
        SERVICE: services/infrastructure/media-service
        BINARY: media
    ports:
      - "8100:8100"
    environment:
      LIVE_ENABLED: "false"
      LIVE_PROVIDER: disabled
    volumes:
      - ./.docker/etc/media:/app/etc:ro
