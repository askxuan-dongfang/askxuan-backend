Name: email-auth-gateway-local
Host: 127.0.0.1
Port: 58080
Auth:
  AccessSecret: isolated-email-auth-fixture-signing-key-not-production
Etcd:
  Hosts: []
  Key: gateway.service
Upstreams:
  - Prefix: /api/v1/auth
    Target: 127.0.0.1:58081
NoAuthPaths:
  - /api/v1/auth/login
  - /api/v1/auth/admin/login
  - /api/v1/auth/refresh
  - /api/v1/auth/logout
