# Include this location in each HTTPS AskXuan server block.
# MinIO is bound to host loopback only; clients use the public HTTPS origin.
location /objects/ {
    proxy_pass http://127.0.0.1:9000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    expires 7d;
    add_header Cache-Control "public";
}

# MinIO presigned URLs cannot add an arbitrary path prefix because the path is
# part of the S3 signature. Preserve the bucket path and original HTTPS host.
location /askxuan-media/ {
    client_max_body_size 10m;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:9000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
