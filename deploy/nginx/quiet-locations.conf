location = /quiet-api/session {
    limit_req zone=quiet_session burst=20 nodelay;
    limit_req zone=quiet_global burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:18196;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
}
location ^~ /quiet-api/ {
    limit_req zone=quiet_api burst=20 nodelay;
    limit_req zone=quiet_global burst=60 nodelay;
    limit_req zone=quiet_writes_ip burst=30 nodelay;
    limit_req zone=quiet_writes_global burst=60 nodelay;
    limit_req_status 429;
    client_max_body_size 2k;
    proxy_pass http://127.0.0.1:18196;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
}
location = /quiet-ws {
    limit_req zone=quiet_handshake burst=30 nodelay;
    limit_req_status 429;
    limit_conn quiet_connections 40;
    limit_conn quiet_total 400;
    limit_conn_status 429;
    proxy_pass http://127.0.0.1:18196;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_read_timeout 70s;
    proxy_send_timeout 70s;
    proxy_buffering off;
}
location = /quiet-health {
    allow 127.0.0.1;
    deny all;
    proxy_pass http://127.0.0.1:18196/health;
    proxy_connect_timeout 3s;
    proxy_read_timeout 3s;
}
