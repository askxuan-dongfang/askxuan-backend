# http context; these limits cover only the public quiet beta endpoints.
limit_req_zone $binary_remote_addr zone=quiet_session:1m rate=2r/s;
limit_req_zone $binary_remote_addr zone=quiet_api:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=quiet_handshake:1m rate=10r/s;
map $server_name $quiet_global_key { default "quiet-park"; }
limit_req_zone $quiet_global_key zone=quiet_global:1m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=quiet_connections:1m;
limit_conn_zone $quiet_global_key zone=quiet_total:1m;
map $request_method $quiet_write_ip { default ""; POST $binary_remote_addr; }
map $request_method $quiet_write_server { default ""; POST "quiet-park"; }
limit_req_zone $quiet_write_ip zone=quiet_writes_ip:1m rate=20r/m;
limit_req_zone $quiet_write_server zone=quiet_writes_global:1m rate=60r/m;
