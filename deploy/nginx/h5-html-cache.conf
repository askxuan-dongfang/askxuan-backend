# H5 SPA fallbacks internally redirect to /index.html, so /c/ and /m/ headers
# alone do not prevent browsers from retaining the previous release entrypoint.
location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

# Each H5 role has its own install identity. Nginx's default mime.types may not
# include webmanifest; an explicit type keeps the install metadata readable.
location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

location = /master.webmanifest {
    types { }
    default_type application/manifest+json;
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
