# Upstream tag v0.8.2, commit 3e8b0bfc80b845b2d4b2ed683994748741450a97 (MIT).
# Dedicated persistent stores. Only the application is reachable from AskXuan.
services:
  app:
    image: wechatopenai/weknora-app:v0.8.2
    container_name: askxuan-weknora
    restart: unless-stopped
    env_file: .env
    environment:
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: weknora
      DB_NAME: weknora
      REDIS_ADDR: redis:6379
      RETRIEVE_DRIVER: postgres
      STORAGE_TYPE: local
      STORAGE_ALLOW_LIST: local
      LOCAL_STORAGE_BASE_DIR: /data/files
      DOCREADER_ADDR: docreader:50051
      BUILTIN_MODELS_CONFIG: /app/config/builtin_models.yaml
      SSRF_WHITELIST: embedding,rerank,api.deepseek.com
      NEO4J_ENABLE: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      SSRF_DNS_WHITELIST_ONLY: "true"
      WEKNORA_SANDBOX_DOCKER_ENABLED: "false"
      WEKNORA_MODEL_MAX_CONCURRENCY: 2
      MAX_FILE_SIZE_MB: 20
      LOG_LEVEL: error
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-true}
    volumes:
      - files:/data/files
      - reader-tmp:/tmp/docreader:ro
      - ./config.yaml:/app/config/config.yaml:ro
      - ./builtin_models.yaml:/app/config/builtin_models.yaml:ro
    ports: ["127.0.0.1:18085:8080"]
    networks:
      default: {}
      askxuan: {aliases: [askxuan-weknora]}
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      embedding: {condition: service_healthy}
  postgres:
    image: paradedb/paradedb:v0.22.6-pg17
    container_name: askxuan-weknora-postgres
    environment:
      POSTGRES_USER: weknora
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: weknora
    volumes: ["postgres:/var/lib/postgresql/data"]
    mem_limit: 1536m
    shm_size: 256m
    cpus: 2
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weknora -d weknora"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.0
    container_name: askxuan-weknora-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    volumes: ["redis:/data"]
    mem_limit: 256m
    restart: unless-stopped
  docreader:
    image: wechatopenai/weknora-docreader:v0.8.2
    container_name: askxuan-weknora-docreader
    environment:
      LOG_LEVEL: error
      DOCREADER_GRPC_MAX_WORKERS: 2
      DOCREADER_GRPC_MAX_FILE_SIZE_MB: 20
      DOCREADER_IMAGE_OUTPUT_DIR: /tmp/docreader
      SSRF_DNS_WHITELIST_ONLY: "true"
    volumes: ["reader-tmp:/tmp/docreader"]
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
  embedding:
    build:
      context: ../ai-embedding
      args:
        APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: askxuan/knowledge-embedding:20260930
    container_name: askxuan-knowledge-embedding
    environment:
      AI_EMBEDDING_KEY: ${AI_EMBEDDING_KEY:?Set AI_EMBEDDING_KEY}
    volumes: ["embedding:/data/models"]
    networks:
      default: {}
      askxuan: {aliases: [askxuan-knowledge-embedding]}
    mem_limit: 1g
    cpus: 2
    restart: unless-stopped
  rerank:
    build:
      context: ../ai-rerank
      args:
        APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: askxuan/knowledge-rerank:20261004
    container_name: askxuan-knowledge-rerank
    environment:
      AI_EMBEDDING_KEY: ${AI_EMBEDDING_KEY:?Set AI_EMBEDDING_KEY}
      MODEL_PATH: ${RERANK_MODEL_PATH:-/data/models/bge-reranker-base}
    volumes: ["rerank:/data/models"]
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
  neo4j:
    image: neo4j:2025.10.1
    container_name: askxuan-weknora-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 768m
      NEO4J_server_memory_pagecache_size: 256m
    volumes: ["neo4j:/data"]
    networks:
      default: {}
      askxuan: {aliases: [askxuan-weknora-neo4j]}
    mem_limit: 1536m
    cpus: 2
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

volumes:
  neo4j:
  rerank:
  files:
  postgres:
  redis:
  reader-tmp:
  embedding:
networks:
  askxuan:
    external: true
    name: askxuan-net
